[package]
name = "yukon_motion_planner"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "migration"]

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
sea-orm = { version = "2.0.0", features = ["sqlx-postgres", "runtime-tokio-native-tls", "macros", "with-chrono", "with-json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
# `sync` is what supplies `wrappers::BroadcastStream`, which turns a simulation's broadcast
# channel into the stream axum's SSE response wants. Already in the tree via sqlx, so this
# adds a name rather than a build.
tokio-stream = { version = "0.1.19", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
migration = { path = "migration" }
rapier2d = "0.35.3"
rand = "0.8.7"

[dev-dependencies]
reqwest = { version = "0.13.4", features = ["json"] }

